[metadata]
name = autotrust
version = 0.1.0
description = Model-agnostic soft-prior multi-objective trust optimization
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=2.0,<3
    scikit-learn>=1.5,<2

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8.3,<9
    ruff>=0.9,<1
